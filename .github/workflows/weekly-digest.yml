name: Weekly digest

on:
  schedule:
    # Friday 15:00 UTC. This is the fallback: the primary run happens on the
    # host machine at 09:00 MSK (scripts/run_local.sh), because Reddit answers
    # a home IP and blocks datacenter egress. If that run already published a
    # digest for today, the job below exits without doing anything.
    - cron: "0 15 * * 5"
  workflow_dispatch:
    inputs:
      days:
        description: "Window size in days"
        default: "7"
      end:
        description: "Window end (ISO date, empty = now)"
        default: ""
      limit:
        description: "Number of links in the digest"
        default: "100"
      dry_run:
        description: "Build but do not commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if a digest for today already exists
        id: guard
        run: |
          DATE=$(date -u +%F)
          if [ -f "digest/$DATE.md" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "digest/$DATE.md is already published - the local run got there first"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the full-text cache
        if: steps.guard.outputs.skip != 'true' 
        uses: actions/cache@v4
        with:
          path: data/textcache
          key: textcache-${{ github.run_id }}
          restore-keys: textcache-

      - name: Collect sources
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python scripts/collect_raw.py \
            --days "${{ inputs.days || '7' }}" \
            ${{ inputs.end && format('--end {0}', inputs.end) || '' }} \
            --out data/raw.json

      - name: Build digest
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/build_digest.py \
            --raw data/raw.json \
            --limit "${{ inputs.limit || '100' }}" \
            --outdir digest

      - name: Upload run artifacts
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-run
          path: |
            digest/*.md
            data/*.json
          retention-days: 30

      - name: Commit and push
        if: ${{ !inputs.dry_run && steps.guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain digest)" ]; then
            echo "No new digest produced - nothing to commit."
            exit 0
          fi
          # Match the dated file, not whatever git happens to list first:
          # README.md sorts ahead of it and used to name the commit "README".
          FILE=$(git status --porcelain digest | awk '{print $NF}' \
                 | grep -E '[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | head -1)
          DATE=$(basename "$FILE" .md)

          git config user.name  "kuberpodcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state/ travels with the repo: the runner is new every week, so
          # cross-week de-duplication depends on it being committed.
          git add digest state
          git commit --signoff -m "chore(digest): weekly digest $DATE" \
                                -m "Automated run of the weekly collector over the preceding 7 days."

          # Straight to main. The digest is append-only generated content that
          # was merged unreviewed anyway, and opening a pull request needs the
          # repository to let Actions create one - a permission it withholds,
          # which is what silently stranded the 2026-09-11 run on a branch.
          git pull --rebase origin main
          git push origin HEAD:main
