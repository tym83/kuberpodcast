# ── routing vocabularies ─────────────────────────────────────────────────────
ai_terms: [gpu, cuda, nvlink, nvidia, vllm, sglang, kserve, kubeflow, ray, inference,
           "kv cache", "model serving", mig, dra, "device plugin", llm, "training cluster",
           tpu, triton, "gpu operator", "batch scheduling", volcano, "ai infrastructure",
           tensorrt, "h100", "b200", "gb200", "gpu cluster"]
ecosystem_terms: ['\brelicens', '\bbsl\b', 'business source', '\bsspl\b', 'elastic license',
                  '\bacquir', 'acquisition', '\bfork(ed|ing)? of\b', 'to sunset',
                  'end of life', '\beol\b', 'shutting down', '\braises \$', '\bfunding round',
                  'series [a-e]\b', 'graduat(ed|ion)', 'incubat(ing|ion)', 'sandbox project',
                  'archiv(ed|ing) the project', 'joins the cncf', 'donated to the',
                  'steering committee', 'maintainer(s)? (step|leav|resign)', 'layoffs?',
                  'licence change', 'license change', 'trademark']
incident_terms: ['post[- ]?mortem', 'incident report', 'root cause', '\brca\b', 'outage',
                 'degraded (service|performance)', 'service disruption',
                 'we (had|experienced) an? (outage|incident)', 'разбор (инцидента|аварии)',
                 'постмортем', 'incident review', 'what happened on \d']
security_terms: ['CVE-\d{4}-\d{4,}', 'GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}',
                 'security advisory', 'security release', 'privilege escalation',
                 'remote code execution', '\brce\b', 'container escape', 'supply[- ]chain attack',
                 'malicious (package|dependency)', 'typosquat', 'уязвимост', 'эксплойт']
breaking_terms: ['breaking change', 'action required', 'backwards[- ]incompatible',
                 'no longer supported', 'removed in this release', 'migration required',
                 'deprecat(ed|ion) notice', 'end of support']
benchmark_terms: ['\bp99\b', '\bp95\b', 'throughput of', 'requests? per second', '\brps\b',
                  'benchmark', 'latency dropped', 'speedup of', '\bqps\b', 'we measured']

