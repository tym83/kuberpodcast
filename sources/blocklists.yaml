# Noise filters. Every rule carries a reason code that ends up in the rejected log.
# Regexes are Python, applied with re.IGNORECASE | re.UNICODE.

# ── seo_listicle ─────────────────────────────────────────────────────────────
seo_listicle:
  - '^\s*(the\s+)?(top|best)\s+\d{1,3}\b'
  - '\b(top|best)\s+\d{1,3}\s+\w+.{0,60}\b20\d\d\b'
  - '\b\d{1,3}\s+(best|top|essential|must[- ](know|have|read)|awesome|amazing|powerful)\b'
  - '\b(ultimate|complete|definitive|comprehensive)\s+(guide|tutorial|handbook|checklist)\b'
  - "\\b(a\\s+)?(beginner|newbie|noob|dummies)('?s)?\\s+(guide|intro|introduction)\\b"
  - '\bfor\s+(beginners|dummies|newbies)\b'
  - '\b(getting started|step[- ]by[- ]step|from scratch|zero to hero|crash course|cheat[- ]?sheet)\b'
  - '\b(what|why|how)\s+is\s+\w+\s*\??$'
  - '\b(kubernetes|docker|devops|terraform|linux|ansible)\s+(101|basics|fundamentals|tutorial)\b'
  - '\b(day|week)\s?[-–]?\s?\d{1,3}\s+of\b'
  - '\b\d{2,3}\s?days?\s+of\s+\w+'
  - '\b(explained (simply|in \d+ minutes)|in\s+\d+\s+minutes|tl;?dr guide)\b'
  - '\b(everything|all) you need to know\b'
  - '\b(vs\.?|versus)\b.{0,30}\bwhich (one )?(should you|to) (choose|use|pick)\b'

# ── vendor_pr ────────────────────────────────────────────────────────────────
vendor_pr:
  - '\b(named|recognized|positioned) (a|as) .{0,40}\b(leader|visionary|challenger)\b'
  - '\b(magic quadrant|forrester wave|gartner peer insights|idc marketscape)\b'
  - '\b(webinar|register (now|today)|save your seat|reserve your spot|book a demo|free trial)\b'
  - '\b(sign up (today|now)|join us (live|for a)|watch on[- ]demand)\b'
  - '\b(sponsor(ed|ship)?|call for (papers|proposals|speakers)|cfp (is )?(open|closes))\b'
  - '\b(early[- ]bird|tickets? (are )?(now )?(on sale|available)|diamond sponsor)\b'
  - '\bnow available (on|in) the (aws|azure|google cloud|gcp) marketplace\b'
  - '\b(achieves|earns|receives)\b.{0,30}\b(soc ?2|iso ?27001|fedramp|hipaa|pci ?dss)\b'
  - '\b(customer (story|success)|case study|testimonial)\b'
  - '^\s*press release\b'
  - '\b(award|awards) (winner|finalist)\b'
  # Regional rollouts of an existing service: an availability notice, not news.
  - '\b(is |are )?now available in .{0,60}\bregions?\b'
  - '\bis now generally available in\b'
  - '\bexpands? (to|into) .{0,40}\bregions?\b'
  - '\bnew .{0,30}\b(local zone|availability zone|regions?) (is |are )?(now )?(open|available)\b'
  # Routine distro round-ups: a daily list of package bumps, not a story.
  - '^security updates for (monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b'
  - '^\[?(usn|dsa|rhsa)[- ]?\d+.*: .*(vulnerabilit|update)s?\s*$'
pr_domains:
  - prnewswire.com
  - businesswire.com
  - globenewswire.com
  - einpresswire.com
  - accesswire.com
  - newswire.com
  - prweb.com
  - openpr.com

# ── beginner ─────────────────────────────────────────────────────────────────
beginner_body:
  - '\bin this (article|tutorial|post),? (you|we) will learn\b'
  - '\bprerequisites?:\s*(basic|a basic|some) (knowledge|understanding|familiarity)\b'
  - "\\bif you('re| are) new to\\b"
  - "\\bbefore we (dive in|begin|start),? let('s| us) (understand|define) what\\b"
  - '\bwhat (is|are) (a )?(pod|container|namespace|deployment|service)s?\?'
# Feeds that are pedagogical by design and must skip the concept-density check.
beginner_exempt_sources: [iximiuz, learnk8s, jvns, k8s-blog, k8s-contrib]

# ── ai_slop ──────────────────────────────────────────────────────────────────
ai_slop_phrases:
  - "in today's fast-paced"
  - "ever-evolving landscape"
  - "ever-changing landscape"
  - "delve into"
  - "it's important to note that"
  - "it's worth noting that"
  - "game-changer"
  - "game changer"
  - "unlock the power"
  - "harness the power"
  - "in the world of"
  - "revolutioniz"
  - "seamlessly integrat"
  - "robust and scalable"
  - "cutting-edge solution"
  - "leverage the power"
  - "navigate the complexities"
  - "in conclusion,"
  - "let's dive in"
  - "buckle up"
  - "the landscape of"
  - "paradigm shift"
  - "at the end of the day,"
  - "tapestry of"
  - "stands as a testament"
  - "plays a crucial role"
  - "a myriad of"
# Surfaces where two slop phrases are already enough to drop.
ai_slop_strict_domains:
  - dev.to
  - hashnode.dev
  - dzone.com
  - geeksforgeeks.org
  - simplilearn.com
  - k21academy.com
  - edureka.co
  - tutorialspoint.com
  - javatpoint.com
  - medium.com

# ── reddit_help / reddit_selfpost ────────────────────────────────────────────
reddit_drop_flair: [help, question, support, troubleshooting, career, hiring, meme,
                    humor, humour, rant, shitpost, survey, poll, showoff, "homelab pics"]
reddit_drop_title:
  - '^\s*(help|question|q|advice|support)\b\s*[:!,\-–]'
  - '\bhow (do|can|would|should) (i|we|you)\b'
  - "\\bwhy (is|are|does|do|won't|can't) (my|our|this|the)\\b"
  - '\bis (this|it|that) (normal|expected|a bug)\b'
  - '\bneed (help|advice|guidance|opinions?)\b'
  - '\bany(one|body) (else )?(know|have|using|tried|experienced|seeing)\b'
  - '\b(what|which) (is|are) the best\b.*\?'
  - '\brecommend(ation)?s?\b.*\?\s*$'
  - '\b(cka|ckad|cks|kcna|certification|exam|resume|cv|interview|salary|compensation)\b'
  - '\b(job (hunt|search)|hiring|laid off|layoff|career (advice|change|path))\b'
  - '\b(rate my|roast my|my first|just finished my)\b'
  - '\bhomelab (tour|update|build)\b'
reddit_image_hosts: [i.redd.it, imgur.com, i.imgur.com, v.redd.it, preview.redd.it]

# ── job_post ─────────────────────────────────────────────────────────────────
job_post:
  - "\\bwe(\\'| a)re hiring\\b"
  - '\bnow hiring\b'
  - '\bjob (opening|opportunity|posting|alert)\b'
  - '\b(apply now|join our team|open (roles?|positions?)|career opportunities)\b'
  - '^ask hn:\s*who (is hiring|wants to be hired)'
  - '^\s*\[hiring\]'
  - '^\s*\[for hire\]'
  - '\b(usd|eur|\$)\s?\d{2,3}[kк]\b.{0,20}\b(salary|comp|per year)\b'

# ── repost / recycled ────────────────────────────────────────────────────────
recycled:
  - '\b(revisit(ed|ing)|from the archives|reader favou?rites|most[- ]read)\b'
  - '\b(year in review|20\d\d in review|best of 20\d\d)\b'

# ── paywall / not_an_article ─────────────────────────────────────────────────
paywall_domains: [wsj.com, bloomberg.com, ft.com, theinformation.com, businessinsider.com,
                  nytimes.com, economist.com, seekingalpha.com, forbes.com]
paywall_body:
  - '\bmember[- ]only story\b'
  - '\bsubscribe to (read|continue)\b'
  - '\bcreate a free account to (read|continue)\b'
  - '\bthis article is for subscribers\b'
not_an_article:
  - '(?<!/releases)/(tag|tags|category|categories|topics?|author|search)/'
  - '/page/\d+/?$'
  - '/(events?|webinars?|training|courses?|pricing|about|careers?|jobs?)(/|$)'

