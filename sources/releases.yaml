# GitHub repositories polled for releases published inside the digest window.
#
# `min_bump` is the newsworthiness floor for the repo: a release below it is
# emitted only when the notes are substantial or carry a CVE / breaking change.
# `rc: true` lets .0 release candidates through (a k8s 1.35.0-rc.1 is a story;
# a Grafana RC is not). `mirror_of` suppresses a repo and credits its parent.
# `changelog_url` marks repos that publish no GitHub Releases at all.
repos:
  core_kubernetes:
    min_bump: patch
    rc: true
    list:
      - {repo: kubernetes/kubernetes, min_bump: 'patch', rc: true}
      - {repo: kubernetes/kubectl, mirror_of: 'kubernetes/kubernetes'}
      - {repo: kubernetes-sigs/cluster-api}
      - {repo: kubernetes-sigs/gateway-api}
      - {repo: kubernetes/autoscaler}
      - {repo: kubernetes-sigs/kueue}
