const cv=document.getElementById('c'), ctx=cv.getContext('2d');

/* ================= helpers ================= */
function rnd(s){const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function jit(s,a){return (rnd(s)-0.5)*2*a;}
const cl=x=>Math.max(0,Math.min(1,x));
function hex2hsl(h){h=h.replace('#','');const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let s=0,hh=0;
  if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    hh=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);hh*=60;}
  return [hh,s,l];}
function hsl2css(h,s,l){return 'hsl('+h.toFixed(1)+','+(s*100).toFixed(1)+'%,'+(l*100).toFixed(1)+'%)';}

/* ================= themes ================= */
const THEMES={
noir:{
  paper:'#14161B', ink:'#0A0B0E', lw:1.0, amp:1.0, faces:true, mood:'noir', rim:'#E8C77A', boilDiv:4,
  speed:0.62, bobMul:0.75, rotMul:0.8, shake:0, fillOff:5.5,
  C(hex){const[h,s,l]=hex2hsl(hex);
    let hh=h, ss=s*0.58, ll=l*0.34+0.03;
    if(l>0.9){ss=0.12;ll=0.50;hh=38;}                       /* whites -> dim ivory  */
    if(s<0.12){hh=205;ss=0.16;}                             /* greys -> cold steel  */
    if(h>=330||h<25){hh=356;ss=Math.min(0.72,s*0.95);ll=l*0.44;} /* reds stay blood  */
    if(h>=25&&h<62){hh=39;ss=Math.min(0.8,s*0.9);ll=l*0.5;} /* ambers glow          */
    return hsl2css(hh,ss,ll);},
  inkOf(){return '#07080B';},
  title:{capMain:126,capSub:74,capEp:96,inkMain:'#E8C77A',shMain:'#000000',inkSub:'#9FB6C6',
         inkEp:'#C0392B',shEp:'#000000',rule:'double',appear:'fade',ruleCol:'#8A6A2E'},
  board:{frame:'#2A2118',glass:'#1D2A2E',text:'#F0DFAE',dim:'#0C1013'}
},
garage:{
  paper:'#E9E2D0', ink:'#141210', lw:1.35, amp:2.2, faces:true, mood:'cute', boilDiv:2,
  speed:1.35, bobMul:1.45, rotMul:1.7, shake:5, fillOff:13,
  C(hex){const[h,s,l]=hex2hsl(hex);
    if(l>0.86)return '#EFE8D8';
    if(l<0.3)return '#141210';
    if(s<0.18)return l>0.55?'#EFE8D8':'#141210';
    if(h>=28&&h<72)return '#F0BE18';
    if(h>=150&&h<300)return '#141210';
    if(h>=300&&h<330)return '#F0BE18';
    return '#D8231C';},
  inkOf(){return '#141210';},
  title:{capMain:132,capSub:70,capEp:100,inkMain:'#141210',shMain:'#D8231C',inkSub:'#141210',
         inkEp:'#D8231C',shEp:'#141210',rule:'scrawl',appear:'slam',ruleCol:'#141210'},
  board:{frame:'#CFC5AC',glass:'#EFE8D8',text:'#141210',dim:'#D8231C'}
},
postpunk:{

  speed:0.85, bobMul:0.15, rotMul:0.1, shake:0, fillOff:0,
  C(hex){const[h,s,l]=hex2hsl(hex);

  inkOf(){return '#DEE3E7';},

         inkEp:'#B4302A',shEp:null,rule:'thin',appear:'wipe',ruleCol:'#5A646C'},
  board:{frame:'#3A424A',glass:null,text:'#EDF1F4',dim:'#B4302A'}

let TH=THEMES.noir, THN='noir';
function setTheme(n){THN=n;TH=THEMES[n];}
window.setTheme=setTheme;
window.THEME_LIST=Object.keys(THEMES);

/* ================= drawing primitives ================= */
function smooth(P,close){
  ctx.beginPath(); if(P.length<2)return;
  if(close){
    const m0=[(P[P.length-1][0]+P[0][0])/2,(P[P.length-1][1]+P[0][1])/2];
    ctx.moveTo(m0[0],m0[1]);
    for(let i=0;i<P.length;i++){const c=P[i],n=P[(i+1)%P.length];
      ctx.quadraticCurveTo(c[0],c[1],(c[0]+n[0])/2,(c[1]+n[1])/2);}
    ctx.closePath();
  }else{
    ctx.moveTo(P[0][0],P[0][1]);
    for(let i=1;i<P.length-1;i++)ctx.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2);
    ctx.lineTo(P[P.length-1][0],P[P.length-1][1]);
  }
}
function wob(P,seed,amp){return P.map((p,i)=>[p[0]+jit(seed+i*3.71,amp),p[1]+jit(seed+i*3.71+77,amp)]);}
function blobPts(cx,cy,r,n,seed,amp){const P=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=r+jit(seed+i*2.3,amp);
  P.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}return P;}
function rectPts(x,y,w,h,step){const P=[],sx=Math.max(2,Math.round(w/step)),sy=Math.max(2,Math.round(h/step));
  for(let i=0;i<sx;i++)P.push([x+w*i/sx,y]);
  for(let i=0;i<sy;i++)P.push([x+w,y+h*i/sy]);
  for(let i=0;i<sx;i++)P.push([x+w-w*i/sx,y+h]);
  for(let i=0;i<sy;i++)P.push([x,y+h-h*i/sy]);return P;}
function unionOutline(circles,n){const P=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,dx=Math.cos(a),dy=Math.sin(a);let best=0;
    for(const c of circles){const ox=c[0],oy=c[1],pr=ox*dx+oy*dy,pe=(ox*ox+oy*oy)-pr*pr,r2=c[2]*c[2];
      if(pe<r2){const d=pr+Math.sqrt(r2-pe);if(d>best)best=d;}}
    P.push([dx*best,dy*best]);}return P;}

function paint(P,close,fill,seed,opt){
  opt=opt||{};
  const amp=(opt.amp!==undefined?opt.amp:3.2)*TH.amp, lw=(opt.lw||9)*TH.lw;
  const f=opt.raw?fill:(fill?TH.C(fill):null);
  if(f){
    ctx.save();
    const off=TH.fillOff;
    ctx.translate(jit(seed+9,off),jit(seed+19,off));
    smooth(wob(P,seed+500,amp*1.5),close);
    ctx.fillStyle=f;ctx.fill();ctx.restore();
  }
  if(opt.stroke!==false&&TH.rim&&!opt.raw){
    ctx.save();ctx.globalAlpha=ctx.globalAlpha*0.32;ctx.translate(-5,-6);
    smooth(wob(P,seed+31,amp),close);
    ctx.strokeStyle=TH.rim;ctx.lineWidth=lw*0.7;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
    ctx.restore();
  }
  if(opt.stroke!==false){
    smooth(wob(P,seed,amp),close);
    ctx.strokeStyle=opt.ink||TH.ink;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
  }
}
function stroke(P,close,seed,opt){paint(P,close,null,seed,opt||{});}
function dot(x,y,r,c,seed){paint(blobPts(x,y,r,9,seed,r*0.14),true,c,seed,{lw:5});}

function face(x,y,s,seed,blink){
  if(!TH.faces)return;
  const eo=22*s, ik=TH.ink;
  if(TH.mood==='noir'){                       /* narrowed eyes, no smile, no blush */
    stroke([[x-eo-11*s,y-2*s],[x-eo+11*s,y-1*s]],false,seed+11,{lw:7*s,amp:1.2});
    stroke([[x+eo-11*s,y-1*s],[x+eo+11*s,y-2*s]],false,seed+12,{lw:7*s,amp:1.2});
    paint(blobPts(x-eo+1*s,y+1*s,3.4*s,7,seed+13,0.8),true,ik,seed+13,{lw:2,amp:0.8,raw:true});
    paint(blobPts(x+eo-1*s,y+1*s,3.4*s,7,seed+14,0.8),true,ik,seed+14,{lw:2,amp:0.8,raw:true});
    stroke([[x-17*s,y+26*s],[x+17*s,y+23*s]],false,seed+15,{lw:6*s,amp:1.5});
    return;
  }
  if(blink){
    stroke([[x-eo-9*s,y],[x-eo,y+5*s],[x-eo+9*s,y]],false,seed+3,{lw:6*s});
    stroke([[x+eo-9*s,y],[x+eo,y+5*s],[x+eo+9*s,y]],false,seed+4,{lw:6*s});
  }else{
    paint(blobPts(x-eo,y,7.5*s,8,seed+1,1.2),true,ik,seed+1,{lw:3,amp:1,raw:true});
    paint(blobPts(x+eo,y,7.5*s,8,seed+2,1.2),true,ik,seed+2,{lw:3,amp:1,raw:true});
  }
  const m=[];for(let i=0;i<=6;i++){const t=i/6;m.push([x-20*s+40*s*t,y+22*s+Math.sin(t*Math.PI)*13*s]);}
  stroke(m,false,seed+5,{lw:6*s,amp:1.6});
  if(THN==='garage'){paint(blobPts(x-40*s,y+16*s,9*s,8,seed+6,1.5),true,'#D8231C',seed+6,{stroke:false,raw:true});
                     paint(blobPts(x+40*s,y+16*s,9*s,8,seed+7,1.5),true,'#D8231C',seed+7,{stroke:false,raw:true});}
  else if(THN==='noir'){paint(blobPts(x-40*s,y+16*s,9*s,8,seed+6,1.5),true,'#6B3230',seed+6,{stroke:false,raw:true});
                        paint(blobPts(x+40*s,y+16*s,9*s,8,seed+7,1.5),true,'#6B3230',seed+7,{stroke:false,raw:true});}
}

  stroke([[36,-42],[76,-30],[96,-6]],false,sd+42,{lw:6});
  ctx.restore();
  face(4,-2,1.05,sd+200,rnd(sd+Math.floor(t*3))>0.93);
}

}
function oBox(sd,t,col){

  for(let i=-2;i<=2;i++)stroke([[i*36,-64],[i*36,64]],false,sd+i*7+30,{lw:6,amp:2.4});

}
function oWheel(sd,t){
  paint(blobPts(0,0,96,16,sd,4),true,'#4D96FF',sd,{lw:11});
  paint(blobPts(0,0,52,14,sd+9,3),true,'#FFF7E8',sd+9,{lw:9});
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2;
    stroke([[Math.cos(a)*40,Math.sin(a)*40],[Math.cos(a)*128,Math.sin(a)*128]],false,sd+i*17+20,{lw:11});
    paint(blobPts(Math.cos(a)*140,Math.sin(a)*140,17,9,sd+i*23+40,2),true,'#3B7BE0',sd+i*23+40,{lw:8});}
  paint(blobPts(0,0,17,9,sd+70,2),true,'#FFD447',sd+70,{lw:7});
}
function oGear(sd,t){
  const P=[],n=9;
  for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+0.5)/n*Math.PI*2,w=0.30;
    P.push([Math.cos(a0-w*0.6)*74,Math.sin(a0-w*0.6)*74]);
    P.push([Math.cos(a0-w*0.5)*104,Math.sin(a0-w*0.5)*104]);
    P.push([Math.cos(a0+w*0.5)*104,Math.sin(a0+w*0.5)*104]);
    P.push([Math.cos(a0+w*0.6)*74,Math.sin(a0+w*0.6)*74]);
    P.push([Math.cos(a1)*72,Math.sin(a1)*72]);}
  paint(P,true,'#FFD447',sd,{lw:9,amp:2.4});
  paint(blobPts(0,0,30,11,sd+5,2.5),true,'#FFF7E8',sd+5,{lw:8});
}
function oTerm(sd,t){
  paint(rectPts(-125,-92,250,184,28),true,'#F3F6F8',sd,{lw:10});
  paint(rectPts(-125,-92,250,44,26),true,'#C9D6DF',sd+3,{lw:8});

  paint(rectPts(-104,-30,208,110,26),true,'#2F5D50',sd+6,{lw:8});
  const scr=THN==='postpunk'?'#B4302A':THN==='garage'?'#F0BE18':'#8FE0A8';
  stroke([[-76,-4],[-46,16],[-76,36]],false,sd+20,{lw:9,ink:scr});
  if(Math.floor(t*3)%2===0)stroke([[-32,40],[16,40]],false,sd+21,{lw:9,ink:scr});
  stroke([[26,-4],[74,-4]],false,sd+22,{lw:7,ink:scr});
}
function oDb(sd,t){
  const w=88,h=118;
  paint(rectPts(-w,-h*0.5,w*2,h,26),true,'#B292FF',sd,{lw:10});
  const el=(cy,f)=>{const P=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2;P.push([Math.cos(a)*w,cy+Math.sin(a)*30]);}paint(P,true,f,sd+cy,{lw:9});};
  el(h*0.5,'#9B76F0'); el(-h*0.5,'#D3C2FF');
  stroke(Array.from({length:9},(_,i)=>[-w+i*(w*2/8),-8+Math.sin(i/8*Math.PI)*20]),false,sd+40,{lw:7,amp:2});
  face(0,26,0.75,sd+500,rnd(sd+Math.floor(t*2.2))>0.9);
}
function oRocket(sd,t){
  const fl=1+0.25*Math.sin(t*22);

  paint([[-30,86],[-16,58],[0,92*fl],[16,58],[30,86]],true,'#FFD447',sd+61,{lw:6,amp:3});

  paint([[0,-118],[36,-30],[34,62],[-34,62],[-36,-30]],true,'#F5F1E8',sd,{lw:10,amp:3});
  paint(blobPts(0,-34,26,11,sd+5,2.5),true,'#4D96FF',sd+5,{lw:8});

function oWifi(sd,t){
  dot(0,60,15,'#FF8CC6',sd);
  for(let i=1;i<=3;i++){const r=40*i+14,P=[];
    for(let k=0;k<=12;k++){const a=Math.PI*1.18+k/12*Math.PI*0.64;P.push([Math.cos(a)*r,60+Math.sin(a)*r]);}
    const alive=(Math.floor(t*3)%3)>=i-1;
    ctx.save();if(!alive)ctx.globalAlpha=ctx.globalAlpha*0.35;
    stroke(P,false,sd+i*13,{lw:11});ctx.restore();}
}
function oBolt(sd,t){paint([[10,-96],[-46,10],[-6,10],[-24,96],[46,-16],[4,-16]],true,'#FFD447',sd,{lw:9,amp:3});}
function oStarObj(sd,t,col){
  const P=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i/10*Math.PI*2,r=i%2?26:62;P.push([Math.cos(a)*r,Math.sin(a)*r]);}
  paint(P,true,col||'#FFD447',sd,{lw:8,amp:2.5});

function oPlug(sd,t){
  paint(rectPts(-46,-40,92,80,26),true,'#6DD47E',sd,{lw:9});
  stroke([[-24,-40],[-24,-84]],false,sd+3,{lw:10});
  stroke([[24,-40],[24,-84]],false,sd+4,{lw:10});
  const P=[];for(let i=0;i<=10;i++){const u=i/10;P.push([Math.sin(u*Math.PI*2)*26,40+u*84]);}
  stroke(P,false,sd+6,{lw:10,amp:2.5});
  face(0,4,0.55,sd+700,false);
}

const ALIAS={'К':'K','Е':'E','Ё':'E','Т':'T','С':'C','Р':'P','Н':'H','О':'O','А':'A','М':'M','В':'B','Х':'X'};
function gl(ch){return G[ch]||G[ALIAS[ch]]||G[' '];}
function textW(str,cap,track){let t=0;for(const ch of str)t+=gl(ch).w*cap+track;return t-track;}
function drawText(str,cx,cy,cap,opt){
  opt=opt||{};
  const track=opt.track!==undefined?opt.track:cap*0.16;
  const total=textW(str,cap,track);
  let x=(opt.align==='left')?cx:cx-total/2;
  const prog=opt.prog||(()=>1);
  const rigid=(THN==='postpunk');
  [...str].forEach((ch,i)=>{
    const g=gl(ch), a=prog(i);
    if(a>0.001&&g.s.length){
      const sd=(opt.seed||0)+i*97+(opt.boil||0), gw=g.w*cap;
      const jx=rigid?0:jit(sd+1,cap*0.045), jy=rigid?0:jit(sd+2,cap*0.06);
      const rot=rigid?0:jit(sd+3,0.055)+(1-Math.min(a,1))*0.5;
      const sc=rigid?a:(0.94+rnd(sd+4)*0.12)*a;
      ctx.save();
      ctx.translate(x+gw/2+jx,cy-cap*0.5+jy);ctx.rotate(rot);ctx.scale(sc,sc);ctx.translate(-gw/2,-cap*0.5);
      ctx.globalAlpha=Math.min(1,a*1.6)*(opt.alpha!==undefined?opt.alpha:1);
      g.s.forEach((poly,k)=>{
        const P=poly.map(p=>[p[0]*cap,p[1]*cap]);
        if(opt.chalk){
          ctx.save();ctx.globalAlpha=ctx.globalAlpha*0.4;
          stroke(P,!!poly.closed,sd+k*11+400,{lw:opt.lw*2.1,ink:opt.glow||'#FFFFFF',amp:cap*0.035});ctx.restore();
        }
        if(opt.shadow){ctx.save();ctx.translate(cap*(opt.shOff||0.055),cap*(opt.shOff||0.06));
          stroke(P,!!poly.closed,sd+k*11+900,{lw:opt.lw,ink:opt.shadow,amp:cap*0.022});ctx.restore();}
        stroke(P,!!poly.closed,sd+k*11,{lw:opt.lw,ink:opt.ink,amp:cap*(rigid?0.008:0.022)});
      });
      ctx.restore();
    }
    x+=g.w*cap+track;
  });
}

function back(x){const c=1.70158,c3=c+1,u=x-1;return x>=1?1:1+c3*u*u*u+c*u*u;}
function popper(t,start,stag,dur,kind){
  return i=>{const a=cl((t-start-i*stag)/dur);
    if(kind==='slam')return a>=1?1:back(a)*(1+jit(i*13+Math.floor(t*30),0.05));
    if(kind==='fade')return a;
    if(kind==='wipe')return a<0.999?(a>0.5?1:0):1;
    return back(a);};
}

    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);

    ctx.translate(Math.floor(rnd(boil)*300),Math.floor(rnd(boil+3)*300));ctx.fillRect(-400,-400,W+800,H+800);ctx.restore();

    if(!half)makeHalf();
    ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle=half;
    ctx.translate(Math.floor(rnd(boil)*8),Math.floor(rnd(boil+2)*8));ctx.fillRect(-20,-20,W+40,H+40);ctx.restore();
    ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=0.85;ctx.fillStyle=grain;
    ctx.translate(Math.floor(rnd(boil)*300),Math.floor(rnd(boil+3)*300));ctx.fillRect(-400,-400,W+800,H+800);ctx.restore();
    const v=ctx.createRadialGradient(W/2,H/2,H*0.5,W/2,H/2,H*1.05);
    v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(30,26,22,0.35)');
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  }else{
    ctx.save();ctx.globalAlpha=0.22;ctx.fillStyle='#000';
    for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,2);ctx.restore();
    ctx.save();ctx.globalAlpha=0.35;ctx.globalCompositeOperation='overlay';ctx.fillStyle=grain;
    ctx.translate(Math.floor(rnd(boil)*300),Math.floor(rnd(boil+3)*300));ctx.fillRect(-400,-400,W+800,H+800);ctx.restore();
    const v=ctx.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*1.0);
    v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  }
}

/* ================= frame ================= */
function drawFrame(n){
  const t=n/FPS, boil=Math.floor(n/TH.boilDiv)*13.77;
  ctx.setTransform(1,0,0,1,0,0);
  drawBg(t,boil);
  ctx.save();
  if(TH.shake)ctx.translate(jit(boil+1,TH.shake),jit(boil+2,TH.shake));
  const sp=TH.speed;
  const gone=cl((t-DUR)/0.9);
  if(gone<1)drawBoard(t,boil,gone*gone*1250);
  const whoosh=t>DUR?Math.pow((t-DUR)/0.8,2)*2700:0;
  if(t<DUR+1.3)FLY.forEach((o,i)=>{
    const seed=i*613+boil, tt=Math.min(t,DUR);
    const p=((o.off+o.dir*o.laps*sp*tt/DUR)%1+1)%1;
    const x=-M+p*SPAN+o.dir*whoosh;
    const y=o.y+(o.bob||0)*TH.bobMul*Math.sin(Math.PI*2*((o.bc||1)*t/DUR+o.off));
    let rot=0;
    if(o.spin!==undefined)rot=Math.PI*2*o.spin*sp*t/DUR*(THN==='postpunk'?0.5:1);
    else rot=(o.rot||0)*TH.rotMul*Math.PI/180*Math.sin(Math.PI*2*((o.rc||1)*t/DUR+o.off*1.7));
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(o.s,o.s);
    if(o.laps>1&&THN!=='postpunk'){ctx.save();ctx.globalAlpha=0.5;
      for(let k=1;k<=3;k++)stroke([[-o.dir*(118+k*14),-46+k*34],[-o.dir*(176+k*30),-46+k*34]],false,seed+k*9,{lw:9});
      ctx.restore();}
    o.f(seed,t,o.arg);
    ctx.restore();
  });
  if(t>=DUR)drawOutro(t,boil);
  ctx.restore();
  post(t,boil);
}
window.TOTAL=TOTAL;
window.FPS=FPS;
window.drawFrame=drawFrame;
window.grab=function(n){drawFrame(n);return cv.toDataURL('image/png');};
drawFrame(0);
</script></body></html>
