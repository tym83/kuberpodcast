/* ---------- helpers ---------- */
function rnd(s){const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function jit(s,a){return (rnd(s)-0.5)*2*a;}
function smooth(P,close){
  ctx.beginPath(); if(P.length<2)return;
  if(close){const m0=[(P[P.length-1][0]+P[0][0])/2,(P[P.length-1][1]+P[0][1])/2];
    ctx.moveTo(m0[0],m0[1]);
    for(let i=0;i<P.length;i++){const c=P[i],n=P[(i+1)%P.length];
      ctx.quadraticCurveTo(c[0],c[1],(c[0]+n[0])/2,(c[1]+n[1])/2);}
    ctx.closePath();
  }else{ctx.moveTo(P[0][0],P[0][1]);
    for(let i=1;i<P.length-1;i++)ctx.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2);
    ctx.lineTo(P[P.length-1][0],P[P.length-1][1]);}
}
function wob(P,seed,amp){return P.map((p,i)=>[p[0]+jit(seed+i*3.71,amp),p[1]+jit(seed+i*3.71+77,amp)]);}
function blobPts(cx,cy,r,n,seed,amp){const P=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=r+jit(seed+i*2.3,amp);
  P.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}return P;}
function rectPts(x,y,w,h,step){const P=[],sx=Math.max(2,Math.round(w/step)),sy=Math.max(2,Math.round(h/step));
  for(let i=0;i<sx;i++)P.push([x+w*i/sx,y]);
  for(let i=0;i<sy;i++)P.push([x+w,y+h*i/sy]);
  for(let i=0;i<sx;i++)P.push([x+w-w*i/sx,y+h]);
  for(let i=0;i<sy;i++)P.push([x,y+h-h*i/sy]);return P;}
function unionOutline(circles,n){const P=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,dx=Math.cos(a),dy=Math.sin(a);let best=0;
    for(const c of circles){const ox=c[0],oy=c[1],pr=ox*dx+oy*dy,pe=(ox*ox+oy*oy)-pr*pr,r2=c[2]*c[2];
      if(pe<r2){const d=pr+Math.sqrt(r2-pe);if(d>best)best=d;}}
    P.push([dx*best,dy*best]);}return P;}
function ell(cx,cy,rx,ry,n){const P=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;P.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}P.closed=true;return P;}
function paint(P,close,fill,seed,opt){
  opt=opt||{};const amp=opt.amp!==undefined?opt.amp:3.2, lw=opt.lw||9;
  if(fill){ctx.save();ctx.translate(jit(seed+9,5.5),jit(seed+19,5.5));
    smooth(wob(P,seed+500,amp*1.5),close);ctx.fillStyle=fill;ctx.fill();ctx.restore();}
  if(opt.stroke!==false){smooth(wob(P,seed,amp),close);
    ctx.strokeStyle=opt.ink||INK;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}
}
function stroke(P,close,seed,opt){paint(P,close,null,seed,opt||{});}
function dot(x,y,r,c,seed){paint(blobPts(x,y,r,9,seed,r*0.14),true,c,seed,{lw:5});}
function face(x,y,s,seed){
  const eo=22*s;
  paint(blobPts(x-eo,y,7.5*s,8,seed+1,1.2),true,INK,seed+1,{lw:3,amp:1});
  paint(blobPts(x+eo,y,7.5*s,8,seed+2,1.2),true,INK,seed+2,{lw:3,amp:1});
  const m=[];for(let i=0;i<=6;i++){const t=i/6;m.push([x-20*s+40*s*t,y+22*s+Math.sin(t*Math.PI)*13*s]);}
  stroke(m,false,seed+5,{lw:6*s,amp:1.6});
  paint(blobPts(x-40*s,y+16*s,9*s,8,seed+6,1.5),true,'#FF9FB2',seed+6,{stroke:false});
  paint(blobPts(x+40*s,y+16*s,9*s,8,seed+7,1.5),true,'#FF9FB2',seed+7,{stroke:false});
}

function gl(ch){return G[ch]||G[ALIAS[ch]]||G[' '];}
function textW(str,cap,track){let t=0;for(const ch of str)t+=gl(ch).w*cap+track;return t-track;}
function drawText(str,cx,cy,cap,opt){
  opt=opt||{};
  const track=opt.track!==undefined?opt.track:cap*0.16;
  const total=textW(str,cap,track);
  let x=(opt.align==='left')?cx:cx-total/2;

    const g=gl(ch);

          stroke(P,!!poly.closed,sd+k*11+400,{lw:opt.lw*2.1,ink:'#FFFFFF',amp:cap*0.035});ctx.restore();}

        stroke(P,!!poly.closed,sd+k*11,{lw:opt.lw,ink:opt.ink||INK,amp:cap*0.022});

function bgStar(x,y,r,seed,col){

function squiggle(cx,y,w,seed,col,lw){

function chalkboard(cx,cy,bw,bh,scale,seed){

/* ---------- grain + export ---------- */
function grainPass(w,h){
  const g=document.createElement('canvas');g.width=g.height=380;
  const gx=g.getContext('2d'),id=gx.createImageData(380,380);
  for(let i=0;i<380*380;i++){const v=200+Math.floor(rnd(i*1.7)*55);
    id.data[i*4]=v;id.data[i*4+1]=v;id.data[i*4+2]=v;id.data[i*4+3]=24;}
  gx.putImageData(id,0,0);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='multiply';
  ctx.fillStyle=ctx.createPattern(g,'repeat');ctx.fillRect(0,0,w,h);ctx.restore();
}
const HOSTS={};
window.loadHosts=function(map){
  /* Единственное исключение из правила «никаких картинок»: фотографии ведущих.
     Вырезанные PNG приходят из assets/hosts/ как data-URI, canvas рисует их
     поверх нарисованной кодом графики. Всё остальное по-прежнему координаты. */
  return Promise.all(Object.entries(map).map(([k,src])=>new Promise(res=>{
    const im=new Image(); im.onload=()=>{HOSTS[k]=im;res();}; im.onerror=()=>res(); im.src=src;
  })));
};
function host(k,x,y,h,rot,flip){
  const im=HOSTS[k]; if(!im) return;
  const sc=h/im.height, w=im.width*sc;
  ctx.save(); ctx.translate(x,y); ctx.rotate((rot||0)*Math.PI/180);
  if(flip) ctx.scale(-1,1);
  ctx.drawImage(im,-w/2,-h,w,h);
  ctx.restore();
}

window.render=function(a){
  cv.width=a.w;cv.height=a.h;
  ctx.setTransform(1,0,0,1,0,0);
  const k=a.w/a.bw;
  ctx.save();ctx.scale(k,k);
  LAYOUT[a.layout](a.bw,a.bh,a.opts||{});
  ctx.restore();
  grainPass(a.w,a.h);
  return cv.toDataURL('image/png');
};
